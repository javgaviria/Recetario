backend:
  name: github
  repo: javgaviria/recetario   # <-- reemplazar por tu usuario/repo de GitHub
  branch: main

media_folder: "static/assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: recipes
    label: Recetas
    folder: src/recipes
    create: true
    slug: "{{title}}"
    identifier_field: title
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Tiempo, name: time, widget: string, required: false, hint: "ej. 30 min" }
      - { label: Porciones, name: servings, widget: string, required: false, hint: "ej. 4 porciones" }
      - { label: Foto, name: image, widget: image, required: false }
      - label: Ingredientes
        name: ingredients
        widget: text
        hint: "Pegá la lista, un ingrediente por línea. Si tenés una sección aparte (ej. la salsa), poné una línea '## Salsa' antes de esos ingredientes."
      - label: Pasos
        name: steps
        widget: text
        required: false
        hint: "Pegá la preparación, un paso por línea."
      - { label: Notas, name: notes, widget: text, required: false }
